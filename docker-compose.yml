services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crawlbit-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crawlbit-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

networks:
  default:
    name: crawlbit-network
